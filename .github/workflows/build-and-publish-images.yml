name: Build and publish images

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Compute image names (lowercase)
        id: vars
        shell: bash
        run: |
          echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          REPO_NAME="${GITHUB_REPOSITORY##*/}"
          echo "REPO_LC=${REPO_NAME,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: docker/frontend.Dockerfile
          push: true
          tags: ghcr.io/${{ steps.vars.outputs.OWNER_LC }}/${{ steps.vars.outputs.REPO_LC }}-frontend:latest

      - name: Build and push whatsapp-bot image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: docker/whatsapp-bot.Dockerfile
          push: true
          tags: ghcr.io/${{ steps.vars.outputs.OWNER_LC }}/${{ steps.vars.outputs.REPO_LC }}-whatsapp-bot:latest
